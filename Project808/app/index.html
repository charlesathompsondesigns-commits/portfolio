<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FCF7E6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="808">
<link rel="apple-touch-icon" href="mark/icon-180.png">
<link rel="icon" href="mark/icon-180.png">
<title>808 Maker Space</title>
<meta name="description" content="Book machine time at 808 Maker Space.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js"}}</script>
<style>
  :root{
    /* the makerspace site's palette */
    --cream:#FCF7E6; --brown:#270F05; --warm-gray:#786E64;
    --olive:#808808; --olive-glow:#D6DC55;
    --rule:rgba(39,15,5,.2); --rule-soft:rgba(39,15,5,.12);
    --cream-rule:rgba(252,247,230,.3); --cream-soft:rgba(252,247,230,.7);
    /* three faces only: engraved for names, typewriter for what gets filled in, Helvetica for the form */
    --engraved:"Academy Engraved LET","AcademyEngravedLetPlain",serif;
    --typed:"Special Elite","Courier New",monospace;
    --sans:"Helvetica Neue LT Std","Helvetica Neue",Helvetica,Arial,sans-serif;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--page);color:var(--brown);font-family:var(--sans);font-weight:400;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:left}
  /* paper tooth, the same wash the site uses */
  .tooth{position:fixed;inset:0;pointer-events:none;background:url(art/paper.jpg) 0 0/520px 520px;mix-blend-mode:multiply;opacity:.1;z-index:0}

  .app{position:relative;z-index:1;max-width:440px;margin:0 auto;min-height:100vh;background:var(--page)}
  .view{display:none}
  .view.on{display:block;animation:in .45s ease both}
  @keyframes in{from{opacity:0}to{opacity:1}}

  /* type */
  .label{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--warm-gray);margin:0}
  .title{font-family:var(--engraved);font-weight:400;font-size:44px;line-height:1.02;margin:0}
  .typed{font-family:var(--typed);color:var(--olive);font-size:.8em;letter-spacing:-.01em}
  .caret::after{content:"";display:inline-block;width:.08em;height:.9em;margin-left:.06em;background:currentColor;vertical-align:-.08em;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  /* the glow as a highlighter swipe: only ever on booked time and updates */
  .hl{background:linear-gradient(100deg,rgba(214,220,85,0) .6%,var(--olive-glow) 2.4%,var(--olive-glow) 97%,rgba(214,220,85,0) 99%) 0 55%/100% 78% no-repeat;padding:0 .3em;margin:0 -.1em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
  .hl.swipe{animation:swipe .9s .35s cubic-bezier(.6,0,.2,1) both}
  @keyframes swipe{from{background-size:0 78%}to{background-size:100% 78%}}

  /* the 808 lockup and crest, drawn as masks so they take any ink */
  .mark{display:flex;align-items:center;gap:6px;color:var(--olive)}
  .mark::before{content:"";flex:none;height:100%;aspect-ratio:656/442;background:currentColor;-webkit-mask:url(mark/mark808.svg) center/contain no-repeat;mask:url(mark/mark808.svg) center/contain no-repeat}
  .mark::after{content:"Maker\A Space";white-space:pre;font-family:var(--typed);font-size:18px;line-height:1;letter-spacing:-.01em}
  .crest{display:block;background:var(--olive);-webkit-mask:url(mark/crest.svg) center/contain no-repeat;mask:url(mark/crest.svg) center/contain no-repeat}
  .mark.cream{color:var(--cream)}
  .crest.cream{background:var(--cream)}

  /* ============ the opening: paper, pencil, then the green wash. Her sketch and verdant styles, in motion ============ */
  html.locked,html.locked body{overflow:hidden}
  .splash{position:fixed;inset:0;z-index:61;overflow:hidden;background:#F8F3E3;transition:opacity .45s ease}
  .splash.open{background:none}
  .splash.gone{opacity:0;pointer-events:none}
  .splash canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #skwash{transition:opacity .6s ease}
  .skspot{position:absolute;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;background:radial-gradient(closest-side,rgba(226,214,120,.62),rgba(214,220,85,.24) 52%,rgba(214,220,85,0));mix-blend-mode:screen;opacity:0;transform:scale(.55);transition:opacity 1s ease,transform 1.4s cubic-bezier(.16,1,.3,1)}
  .skspot.on{opacity:1;transform:none}
  .skstage{position:absolute;inset:0;transition:opacity .34s ease;mix-blend-mode:multiply}
  .skstage.out{opacity:0}
  .logoanim{position:absolute;width:656px;height:442px;transform-origin:0 0;filter:url(#skrough)}
  .sqr{position:absolute;width:30.625px;height:30.625px;border:2.6px solid #2E2E26;opacity:0}
  .lf{position:absolute;display:flex;align-items:center;justify-content:center;container-type:size;opacity:0}
  .lf>div{flex:none;position:relative}
  .lf img{position:absolute;inset:0;width:100%;height:100%;max-width:none;display:block;filter:brightness(0) opacity(.8)}
  .skname{position:absolute;left:0;right:0;margin:0;text-align:center;font-family:var(--typed);font-size:34px;line-height:1;letter-spacing:-.01em;color:#2E2E26;opacity:0}
  .skname.on{opacity:1;animation:stamp .5s both}
  /* the stamped word fades up in place. No scale, nothing slams */
  @keyframes stamp{from{opacity:0}to{opacity:1}}

  /* ============ the questions: top dot first, working down a pencil line, on real paper ============ */
  .climb{position:fixed;inset:0;z-index:60;overflow:hidden;background:var(--deep);color:var(--cream);visibility:hidden}
  .climb.on{visibility:visible}
  .climb.gone{opacity:0;transition:opacity .7s ease;pointer-events:none}
  .climb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 66%;transition:transform 1.5s var(--ease)}
  .shade{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(rgba(30,34,4,.62),rgba(30,34,4,.3) 42%,rgba(30,34,4,0) 66%);opacity:0;transition:opacity .8s ease}
  .climb.asking .shade{opacity:1}
  .climb::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:url(art/sheet.jpg) 0 0/512px 512px;mix-blend-mode:multiply;opacity:.75}
  .climbui{position:absolute;inset:0;z-index:4;opacity:0;transition:opacity .6s ease}
  .climb.asking .climbui{opacity:1}
  .rope{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .rope path{fill:none;stroke-linecap:round}
  .climb.enter .rope .ghost,.climb.enter .rope .main{stroke-dasharray:1;animation:draw 1.1s cubic-bezier(.45,0,.55,1) both}
  .rope .ghost{stroke:var(--cream);stroke-width:1;opacity:.34}
  .rope .main{stroke:var(--cream);stroke-width:1.6;opacity:.7}
  .rope .walked{stroke:var(--olive-glow);stroke-width:2.6;transition:stroke-dashoffset .9s var(--ease)}
  .spot{position:absolute;left:30px;width:230px;height:230px;margin:-115px 0 0 -115px;border-radius:50%;background:radial-gradient(closest-side,rgba(226,214,120,.5),rgba(214,220,85,0));mix-blend-mode:screen;pointer-events:none;transition:top .9s var(--ease)}
  .ctop{position:absolute;left:var(--m);right:var(--m);top:calc(4px + var(--safe-t));display:flex;justify-content:space-between;align-items:center;height:48px}
  .ctop .mark{height:48px}
  .cskip{height:44px;padding:0 0 0 16px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cream);transition:opacity .3s ease}
  .steps{position:absolute;left:0;right:0;top:calc(var(--safe-t) + 60px);margin:0;padding:0;list-style:none}
  .stp{position:relative;padding:0 var(--m) 0 54px}
  .nd{position:absolute;left:24px;top:12px;width:12px;height:12px;border:1.6px solid var(--cream);border-radius:3px;background:rgba(30,34,4,.4);filter:url(#rough)}
  .stp.ok .nd{background:var(--olive-glow);border-color:var(--olive-glow)}
  .stp.now .nd{background:var(--cream);box-shadow:0 0 0 4px rgba(252,247,230,.25)}
  .stp.todo{height:42px}
  .stp.todo .nd{opacity:.8}
  .ans{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:36px;color:var(--cream);text-align:left}
  .ans .type{font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 10px rgba(30,34,4,.8)}
  .ans .tag{font-size:10px;letter-spacing:.12em;opacity:.8;flex:0 0 auto}
  .stp.ok{padding-bottom:6px}
  .qhead{font-family:var(--engraved);font-weight:400;font-size:35px;line-height:1.06;margin:0 0 12px;padding-top:2px;-webkit-text-stroke:.3px var(--cream);text-shadow:0 1px 20px rgba(30,34,4,.6);animation:down .55s var(--ease) both}
  .qhead .typed{color:var(--cream);-webkit-text-stroke:0}
  @keyframes down{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
  .qcard{margin-bottom:18px;padding:10px;border-radius:var(--r-card);background:var(--olive);color:var(--deep);animation:down .55s var(--ease) .06s both}
  .qopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .qopts.one{grid-template-columns:1fr}
  .qopt{min-height:54px;padding:12px 10px 5px;border-radius:var(--r-chip);background:var(--sheet);color:var(--deep);font-family:var(--engraved);font-size:22px;line-height:1.05;text-align:center;-webkit-text-stroke:.35px var(--deep);transition:background .2s ease,color .2s ease,scale .15s ease}
  .qopt:active{scale:.97}
  .qopt.on{background:var(--deep);color:var(--cream);-webkit-text-stroke:.35px var(--cream)}
  .qinput{width:100%;height:54px;padding:0 14px;border:0;border-radius:var(--r-chip);background:var(--sheet);color:var(--deep);font-family:var(--typed);font-size:20px;outline:0;caret-color:var(--olive)}
  .qinput::placeholder{color:rgba(64,68,4,.55)}
  .qnext{display:block;width:100%;height:50px;margin-top:8px;border-radius:var(--r-btn);background:var(--deep);color:var(--cream);text-align:center;font-family:var(--typed);font-size:17px;transition:background .25s ease,color .25s ease,box-shadow .25s ease}
  .qnext[disabled]{background:none;box-shadow:inset 0 0 0 1px rgba(252,247,230,.5);color:rgba(252,247,230,.78)}

  /* ============ the app: her fonts and colors, on Apple's spacing. 20pt margins, 44pt targets, continuous-looking corners ============ */
  :root{--page:#F3ECD4;--sheet:#FCF7E6;--light:#E6E7CE;--deep:#404404;--line:rgba(64,68,4,.18);--m:20px;--r-card:20px;--r-tile:14px;--r-btn:14px;--r-chip:12px;--r-sheet:28px}
  .app{color:var(--deep)}
  .app::after{content:"";position:fixed;left:0;right:0;top:0;height:calc(var(--safe-t) + 10px);background:linear-gradient(var(--page) calc(100% - 22px),rgba(243,236,212,0));pointer-events:none;z-index:20;opacity:0;transition:opacity .2s ease}
  .app.scrim::after{opacity:1}
  .app.scrim.olive::after{background:linear-gradient(var(--olive) calc(100% - 22px),rgba(128,136,8,0))}
  .view.tabbed{padding-bottom:calc(100px + var(--safe-b))}
  /* bookings and the shop are one green field to the bottom edge: the field carries the clearance, so no paper shows under it */
  #book.tabbed,#shop.tabbed{padding-bottom:0}

  /* type: engraved for names, typewriter for what gets filled in, Helvetica tracked for the form */
  .tag{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.14em;line-height:1.4;text-transform:uppercase;margin:0}
  .type{display:block;font-family:var(--typed);font-size:15px;line-height:1.45;margin:0}
  .num{font-family:var(--typed);font-size:14px}
  .typed{font-family:var(--typed);color:inherit;font-size:.86em;letter-spacing:-.01em}
  .split{display:flex;justify-content:space-between;align-items:baseline;gap:14px}
  .mname{font-family:var(--engraved);line-height:1.04;color:var(--deep);-webkit-text-stroke:.3px var(--deep)}

  .do{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:50px;padding:0 20px;border-radius:var(--r-btn);background:var(--olive);color:var(--cream);font-family:var(--typed);font-size:17px;letter-spacing:0;text-transform:none;text-align:center}
  .do span{font-size:18px;letter-spacing:0}
  .do:active{background:var(--deep)}
  .do.line{background:rgba(252,247,230,.16);color:var(--cream);width:auto}
  .do.line:active{background:var(--cream);color:var(--olive)}
  .do[disabled]{background:var(--light);color:var(--deep)}
  .sq{display:inline-block;width:12px;height:12px;border:1.2px solid currentColor;border-radius:3px;flex:0 0 auto}
  .sq.on{background:currentColor}

  .mast{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:calc(6px + var(--safe-t)) var(--m) 0}
  .mast .mark{height:48px;margin-left:-4px}
  .bag{position:relative;display:grid;place-items:center;width:44px;height:44px;margin-right:-10px;color:inherit}
  .bag::before{content:"";position:absolute;inset:2px;border-radius:50%;background:rgba(64,68,4,.09)}
  .field .bag,.pushhead .bag,.stagebar .bag{color:var(--olive)}
  .field .bag::before,.pushhead .bag::before,.stagebar .bag::before{background:var(--sheet)}
  .bag svg{position:relative;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linejoin:round}
  .bag b{position:absolute;right:2px;top:4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;font-family:var(--typed);font-weight:400;font-size:11px;line-height:16px;text-align:center;background:var(--olive);color:var(--cream)}
  .bag b{z-index:1}

  .field{position:relative;background:var(--olive);color:var(--cream);overflow:hidden}
  .hl{border-radius:4px}

  /* ---------- home ---------- */
  #hero{border-radius:0 0 var(--r-sheet) var(--r-sheet)}
  .upnext{position:relative;z-index:1;padding:16px var(--m) 8px}
  .uphead{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:8px}
  .uphead h1{font-family:var(--engraved);font-weight:400;font-size:34px;line-height:1.05;margin:0;-webkit-text-stroke:.3px var(--cream)}
  .res{display:grid;grid-template-columns:76px 1fr 16px;column-gap:14px;align-items:center;width:100%;padding:10px 0;border-top:1px solid var(--cream-rule);color:var(--cream);text-align:left}
  .res .rt{display:block;font-family:var(--typed);font-size:16px;line-height:1.3}
  .res .hl{color:var(--deep)}
  .res .rn{display:block;font-family:var(--engraved);font-size:24px;line-height:1.05;margin:3px 0 5px;-webkit-text-stroke:.25px var(--cream)}
  .res .tag{font-size:10px;letter-spacing:.12em}
  .res .go{font-size:16px;justify-self:end}
  .hero-empty{position:relative;z-index:1;padding:24px var(--m) 20px}
  .hero-empty h1{font-family:var(--engraved);font-weight:400;font-size:36px;line-height:1.05;margin:10px 0 18px;-webkit-text-stroke:.3px var(--cream)}

  .sec{padding:32px var(--m) 0}
  .sechead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .sechead h2{font-family:var(--engraved);font-weight:400;font-size:30px;line-height:1.05;color:var(--olive);margin:0;-webkit-text-stroke:.4px var(--olive)}
  .sechead .tag{font-size:10.5px;text-align:right}


  /* ---------- bookings: pick what you're making, the building flies in, then one question at a time ---------- */
  #book.on{min-height:100vh}
  #book.tabbed{padding-bottom:0}
  .ask{position:relative;z-index:2;font-family:var(--engraved);font-weight:400;font-size:33px;line-height:1.06;margin:14px var(--m) 0;-webkit-text-stroke:.3px var(--cream)}
  .folders{min-height:100vh;padding-bottom:calc(72px + var(--safe-b))}
  .flabel{position:relative;z-index:1;margin:18px var(--m) 0}
  .stagebox{position:fixed;left:0;right:0;top:0;z-index:12;height:44vh;max-width:440px;margin:0 auto;display:none;background:var(--olive);color:var(--cream);overflow:hidden}
  .app[data-view="focus"] .stagebox,.app[data-view="machine"] .stagebox,.app[data-view="tour"] .stagebox{display:block}
  .stagebox::before,.stagebox::after{content:"";position:absolute;left:0;right:0;z-index:1;pointer-events:none}
  .stagebox::before{top:0;height:116px;background:linear-gradient(var(--olive) 66%,rgba(128,136,8,0))}
  .stagebox::after{bottom:0;height:128px;background:linear-gradient(rgba(128,136,8,0),var(--olive) 70%)}
  .gl{position:absolute;inset:0;z-index:0}
  .gl.in{animation:glin .7s ease both}
  @keyframes glin{from{opacity:0}}
  .tags{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
  .ptag{position:absolute;left:0;top:0;pointer-events:auto;padding:4px 9px 5px;border-radius:8px;background:var(--sheet);color:var(--deep);font-family:var(--typed);font-size:12.5px;line-height:1.2;white-space:nowrap;text-align:left;box-shadow:0 8px 16px -8px rgba(39,15,5,.6)}
  .ptag::after{content:"";position:absolute;left:50%;bottom:-9px;width:1px;height:9px;background:var(--page)}
  .ptag.num{min-width:26px;padding:4px 7px 5px;text-align:center;background:var(--olive-glow);color:var(--deep)}
  .ptag.num::after{background:var(--olive-glow)}
  .stagebar{position:absolute;left:0;right:0;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:calc(4px + var(--safe-t)) var(--m) 0;pointer-events:none}
  .stagebar>*{pointer-events:auto}
  .stagebar .back{color:var(--cream)}
  .stagename{position:absolute;z-index:3;left:var(--m);right:var(--m);bottom:36px;margin:0;font-family:var(--engraved);font-weight:400;font-size:33px;line-height:1.02;-webkit-text-stroke:.3px var(--cream);pointer-events:none}
  /* the bottom sheet slides over the stage, the way iOS sheets do */
  #focus.on,#machine.on,#tour.on{position:relative;z-index:13;padding-top:calc(44vh - 24px);pointer-events:none}
  .sheetup{pointer-events:auto}
  .tabs{z-index:30}
  #machine.on{display:flex;flex-direction:column;min-height:100vh}
  .sheetup{position:relative;flex:1;display:flex;flex-direction:column;background:var(--page);border-radius:24px 24px 0 0}
  #focus .sheetup,#tour .sheetup{min-height:calc(56vh + 24px)}
  .trow{display:grid;grid-template-columns:68px 1fr 16px;column-gap:14px;align-items:center;width:100%;min-height:92px;padding:12px var(--m);border-bottom:1px solid var(--line);color:var(--deep);text-align:left}
  .trow:last-of-type{border-bottom:0}
  .trow .mname{display:block;font-size:24px}
  .trow .type{margin-top:4px;font-size:13px;line-height:1.35}
  .trow .chev{font-size:16px;justify-self:end}
  .more-link{display:flex;justify-content:space-between;align-items:center;width:calc(100% - var(--m)*2);height:50px;margin:12px var(--m) 0;padding:0 16px;border-radius:var(--r-btn);background:var(--light);font-family:var(--typed);font-size:15px;color:var(--deep)}

  .answer{display:flex;justify-content:space-between;align-items:center;gap:14px;width:100%;min-height:48px;padding:0 var(--m);border-bottom:1px solid var(--line);color:var(--deep);text-align:left}
  .answer .type{font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .answer .tag{font-size:10.5px;color:var(--olive)}
  .qstep{padding:18px var(--m) 0}
  .stepq{font-family:var(--engraved);font-weight:400;font-size:32px;line-height:1.06;margin:0;color:var(--olive);-webkit-text-stroke:.35px var(--olive)}
  .stepq .typed{color:var(--olive);-webkit-text-stroke:0}
  .calhead{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
  .calhead b{font-family:var(--engraved);font-weight:400;font-size:24px;line-height:1;-webkit-text-stroke:.3px var(--deep)}
  .calhead span{display:flex;gap:6px}
  .calarrow{width:44px;height:36px;border-radius:10px;background:var(--light);text-align:center;font-size:17px;line-height:34px;color:var(--deep)}
  .calarrow[disabled]{opacity:.35}
  .calarrow:active{background:var(--olive);color:var(--cream)}
  .caldays{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;text-align:center}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:6px}
  .cal>*{position:relative;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:10px;font-family:var(--typed);font-size:17px;line-height:1;color:var(--deep)}
  .cal .open{background:var(--light)}

  .arow .type{font-size:15px;line-height:1.3}
  .arow .chg{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--olive)}
  .arow.open{background:none}
  .aedit{padding:4px 0 16px;background:url(art/m-rule.svg) left bottom/100% 8px no-repeat;animation:down .4s var(--ease) both}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{min-height:42px;padding:2px 16px 0;border-radius:21px;background:var(--sheet);box-shadow:inset 0 0 0 1px var(--line);font-family:var(--engraved);font-size:19px;color:var(--deep);-webkit-text-stroke:.3px var(--deep)}
  .chip.on{background:var(--olive);color:var(--cream);box-shadow:none;-webkit-text-stroke:.3px var(--cream)}
  .ainput{width:100%;height:50px;padding:0 14px;border:0;border-radius:var(--r-chip);background:var(--sheet);box-shadow:inset 0 0 0 1px var(--line);font-family:var(--typed);font-size:18px;color:var(--deep);outline:0;caret-color:var(--olive)}
  .aedit .do{margin-top:10px}
  .sw{position:relative;width:44px;height:26px;border-radius:13px;background:rgba(64,68,4,.22);transition:background .2s ease}
  .sw i{position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--sheet);transition:translate .22s var(--ease)}
  .sw.on{background:var(--olive)}
  .sw.on i{translate:18px 0}
  .logout{display:block;width:calc(100% - var(--m)*2);height:50px;margin:24px var(--m) 0;border-radius:var(--r-btn);background:var(--light);color:var(--deep);text-align:center;font-family:var(--typed);font-size:17px}
  .logout:active{background:var(--olive);color:var(--cream)}

  /* ---------- the nav: an outline is somewhere you could go, a filled icon is where you are ---------- */
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:1fr 92px 1fr;max-width:440px;margin:0 auto;height:calc(52px + var(--safe-b));padding-bottom:var(--safe-b);background:var(--page);box-shadow:0 -1px 0 var(--line)}
  .app[data-view="machine"] .tabs,.app[data-view="booked"] .tabs,.app[data-view="bagview"] .tabs{display:none}
  .tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:52px;color:var(--deep);opacity:.62;transition:opacity .2s ease}
  .tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linejoin:round;transition:transform .18s var(--ease)}
  .tab svg .body{fill:transparent;transition:fill .2s ease}
  .tab svg .cut{transition:stroke .2s ease}
  .tab span{font-size:10px;letter-spacing:.1em;text-transform:uppercase}
  .tab:active svg,.tab:active .crest{transform:scale(.88)}
  .tab.on{opacity:1;color:var(--olive)}
  .tab.on svg .body{fill:currentColor}
  .tab.on svg .cut{stroke:var(--page)}
  .tab.mid{height:70px;margin:-18px 4px 0;gap:5px;border-radius:18px;opacity:1;color:var(--olive);background:var(--page);box-shadow:inset 0 0 0 1px var(--olive);transition:background .2s ease,color .2s ease}
  .tab.mid .crest{width:24px;height:30px;background:currentColor;transition:transform .18s var(--ease),background .2s ease}
  .tab.mid span{font-size:9px;letter-spacing:.08em}
  .tab.mid.on{color:var(--cream);background:var(--olive);box-shadow:none}

  /* the update: a sheet of paper that drops onto the screen, not a phone banner */
  .slip{position:fixed;z-index:50;left:12px;right:12px;top:calc(8px + var(--safe-t));max-width:416px;margin:0 auto;width:auto;text-align:left;
    border-radius:var(--r-card);background:var(--sheet);padding:14px 18px 18px;color:var(--deep);
    box-shadow:0 22px 44px rgba(39,15,5,.42);transform:translateY(calc(-100% - 70px - var(--safe-t)));transition:transform .75s cubic-bezier(.2,1.1,.3,1)}
  .slip.on{transform:none}
  .slip .top{display:flex;justify-content:space-between;align-items:center}
  .slip .top small{font-family:var(--typed);font-size:12px}
  .slip .say{font-family:var(--engraved);font-size:44px;line-height:1.02;margin:10px 0 8px;color:var(--olive);-webkit-text-stroke:.4px var(--olive)}
  .slip .sub{font-family:var(--typed);font-size:13px;line-height:1.45;margin:0 0 12px;opacity:.95}
  .slip .when{font-family:var(--typed);font-size:24px;line-height:1.25;color:var(--deep);margin:0}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--olive);box-shadow:0 0 0 0 rgba(128,136,8,.7);animation:ping 2.2s ease-out infinite;display:inline-block;margin-right:8px;vertical-align:1px}
  @keyframes ping{to{box-shadow:0 0 0 10px rgba(128,136,8,0)}}

  /* ============ the art pass: her pencil lifted off the sheet, her paint on the photos, her stamp on the words. Things land on the page, nothing just sits there ============ */
  @property --reveal{syntax:'<percentage>';inherits:false;initial-value:170%}
  .field{background:var(--olive) url(art/field.webp) 0 0/402px 700px}
  .ln{position:absolute;z-index:0;pointer-events:none;background:var(--cream);opacity:var(--o,.42);
    -webkit-mask-image:var(--src),radial-gradient(circle at var(--ox,100%) var(--oy,0%),#000 calc(var(--reveal) - 14%),transparent var(--reveal));
    mask-image:var(--src),radial-gradient(circle at var(--ox,100%) var(--oy,0%),#000 calc(var(--reveal) - 14%),transparent var(--reveal));
    -webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-composite:source-in;mask-composite:intersect}
  .enter .ln{animation:reveal 1.35s cubic-bezier(.4,0,.2,1) both}
  @keyframes reveal{from{--reveal:0%}to{--reveal:170%}}
  .ln-home{--src:url(art/lines-exterior.webp);width:610px;height:389px;right:-236px;top:calc(var(--safe-t) - 52px);--o:.38}
  .ln-foot{--src:url(art/lines-exterior.webp);width:560px;height:357px;left:-30px;top:-10px;--o:.4}
  .ln-book{--src:url(art/lines-plan.webp);width:560px;height:560px;right:-256px;top:-74px;rotate:7deg;--o:.34}
  .ln-book2{--src:url(art/lines-cnc.webp);width:780px;height:498px;left:-190px;top:700px;--ox:0%;--o:.26}
  .ln-shop{--src:url(art/lines-store.webp);width:620px;height:396px;right:-200px;top:-12px;--o:.36}
  .ln-shelf{--src:url(art/lines-crib.webp);width:560px;height:357px;right:-170px;top:-34px;--o:.4}
  .ln-card{--src:url(art/lines-exterior.webp);width:350px;height:223px;right:-78px;bottom:-30px;--o:.5}
  .con{position:absolute;left:0;top:0;width:100%;height:440px;z-index:0;pointer-events:none}
  .con path{fill:none;stroke:var(--cream);stroke-linecap:round;stroke-dasharray:1}
  .enter .con path{animation:draw .95s cubic-bezier(.5,0,.2,1) both;animation-delay:calc(var(--i)*80ms)}
  @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}

  /* the stamped word lands last in every headline */
  .ask .typed,.hero-empty .typed,.stepq .typed,.qhead .typed{display:inline-block}
  .enter .ask .typed,.enter .hero-empty .typed{animation:stamp .5s .3s both}
  .stepq .typed{animation:stamp .5s .16s both}
  .qhead .typed{animation:stamp .5s .2s both}

  /* a sheet lands on the page when you reach it, tilted the way a hand leaves it. The one you're looking at straightens up */
  .sett{opacity:0;translate:0 22px;transition:opacity .45s ease var(--d,0s),translate .85s cubic-bezier(.16,1,.3,1) var(--d,0s),scale .25s var(--ease)}
  .sett.inview{opacity:1;translate:0 0}
  .sett.still{transition:none}

  /* a photo, painted on: edges dissolve into the paper, multiply so the sheet shows through. Green wash and a warm spot until you're looking at it, then it blooms into color */
  .phw{position:relative;display:block}
  .ph{position:relative;display:block;overflow:hidden;isolation:isolate;mix-blend-mode:multiply;-webkit-mask:var(--edge) center/100% 100% no-repeat;mask:var(--edge) center/100% 100% no-repeat}
  .ph.plain{mix-blend-mode:normal}
  .ph img{display:block;width:100%;height:100%;object-fit:cover}
  .gw{position:absolute;inset:0;background:var(--olive);mix-blend-mode:color;opacity:.95;transition:opacity .8s ease}
  .ph::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 52% 46%,rgba(255,232,120,.6),rgba(255,232,120,0) 48%);mix-blend-mode:screen;transition:opacity .8s ease}
  .live .gw,.live .ph::after,.ph.plain .gw,.ph.plain::after{opacity:0}

  /* every hairline in the app is a pencil line now */
  .trow,.answer,.mat{border-bottom:0;background:url(art/m-rule.svg) left bottom/100% 8px no-repeat}
  .trow:last-of-type{background:none}
  .res{border-top:0;background:url(art/m-rule-cream.svg) left top/100% 8px no-repeat}
  .tabs{box-shadow:none;background:var(--page) url(art/m-rule.svg) left top/100% 8px no-repeat}
  .sechead{position:relative;margin-bottom:20px;padding-bottom:6px}
  .sechead h2{font-size:35px;line-height:1;white-space:nowrap}
  .sechead::after{content:"";position:absolute;left:0;right:calc(var(--m)*-1);bottom:-4px;height:8px;background:url(art/m-rule.svg) 0 0/100% 100% no-repeat}
  .do.line{background:var(--page);color:var(--olive)}
  .do.line:active{background:var(--deep);color:var(--cream)}

  /* ---------- the one card: Home, Bookings and the shop all use it ---------- */
  .card{position:relative;display:block;width:100%;border-radius:var(--r-card);background:var(--sheet);color:var(--deep);text-align:left;box-shadow:0 16px 30px -22px rgba(64,68,4,.6)}
  .card::before,.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;border:1.1px solid rgba(64,68,4,.52);filter:url(#ink)}
  .card::after{inset:3px -2px -2px 2px;border-color:rgba(64,68,4,.2)}
  .card .ph{height:128px;margin:8px 8px 0;border-radius:12px}
  .card .cb{position:relative;display:block;margin-top:-8px;padding:0 14px 14px}
  .card .cn{display:block;font-family:var(--engraved);font-size:27px;line-height:1.02;margin-bottom:6px;color:var(--deep);-webkit-text-stroke:.3px var(--deep)}
  .card.long .cn{font-size:23px}
  .card .type{font-size:12.5px;line-height:1.35}
  .card.big .ph{height:212px;margin:10px 10px 0}
  .card.big .cb{margin-top:-12px;padding:0 16px 16px}
  .card.big .cn{font-size:40px;margin-bottom:8px;-webkit-text-stroke:.4px var(--deep)}
  .card.big.long .cn{font-size:34px}
  .card.big .type{font-size:13.5px}
  .frec{position:relative;z-index:1;display:grid;gap:16px;padding:12px var(--m) 0}
  .fgrid{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:12px var(--m) 34px}
  .fnext{display:block;margin-top:12px;font-family:var(--typed);font-size:14.5px;color:var(--deep)}
  .fnext em{font-style:normal;padding-bottom:6px;background:url(art/m-under.svg) left bottom/0 9px no-repeat;transition:background-size .7s cubic-bezier(.45,0,.15,1) .2s}
  .live .fnext em{background-size:100% 9px}

  /* the notice: the same card, with the stamp sitting on the photo's edge */
  .notice{width:auto;margin:20px var(--m) 0}
  /* the ticket: your next booking, your pickup, or book again. Paper on the field */
  .ticket{width:auto;margin:14px var(--m) 0;padding:14px 16px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;z-index:1}
  .ticket .tk{display:block;min-width:0;text-align:left;color:var(--deep)}
  .ticket .tt{display:block;margin-top:9px;font-family:var(--typed);font-size:17px;line-height:1.2}
  .ticket .tn{display:block;margin:4px 0 6px;font-family:var(--engraved);font-size:27px;line-height:1.05;-webkit-text-stroke:.25px var(--deep)}
  .ticket .tag{font-size:10px;letter-spacing:.12em}
  .ticket .do{width:auto;height:44px;padding:0 16px;font-size:15px}
  .ticket .do.glow{background:var(--olive-glow);color:var(--deep)}
  .ticket .go{font-size:18px;color:var(--deep)}
  .ticket.again .tn{margin-top:8px}
  .soft2{height:40px;padding:0 14px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);font-family:var(--typed);font-size:14px;color:var(--deep)}
  .tlink{padding:6px 0;font-family:var(--typed);font-size:14px;color:var(--cream);white-space:nowrap}
  .tlink.ask-link{position:relative;z-index:2;display:block;margin:2px var(--m) 0}
  .mright{display:flex;align-items:center;margin-right:-10px}
  .mright .bag{margin-right:0}
  /* today, under Bookings: a pencil bar per slot on the field. The current slot gets a dot, the picked one goes solid */
  .today{padding-top:10px}
  .today .uphead{padding-bottom:2px}
  .subhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:16px 0 4px}
  .typed-h{font-family:var(--typed);font-size:16px;color:var(--cream)}
  .today .res{grid-template-columns:76px 1fr 16px}
  .strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
  .slot{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-height:58px;padding:9px 10px 8px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(252,247,230,.55);color:var(--cream);text-align:left;transition:background .2s ease,color .2s ease}
  .slot .st{font-family:var(--typed);font-size:14px;line-height:1.1}
  .slot .sf{font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
  .slot.on{background:var(--sheet);color:var(--deep);box-shadow:none}
  .slot.on .sf{opacity:1;color:var(--olive)}
  .slot.mine{background:var(--olive-glow);color:var(--deep);box-shadow:none}
  .slot.past{opacity:.35}
  .slot .nowtag{position:absolute;right:7px;bottom:7px;padding:2px 6px 1px;border-radius:6px;background:var(--cream);color:var(--olive);font-family:var(--typed);font-size:10px;font-style:normal;line-height:1.2}
  .slot.on .nowtag{background:var(--olive);color:var(--cream)}
  /* the tour sheet: areas as chips, then where you are and how to book there */
  .tourbody{padding:18px 0 24px}
  .tour-chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 var(--m)}
  .tchip{padding:9px 13px 7px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);font-family:var(--engraved);font-size:19px;line-height:1;color:var(--deep);-webkit-text-stroke:.25px var(--deep)}
  .tchip.on{background:var(--olive);color:var(--cream);box-shadow:none;-webkit-text-stroke:.25px var(--cream)}
  .thint{margin:18px var(--m) 0}
  .tinfo{padding:18px var(--m) 0}
  .tinfo .tname{font-family:var(--engraved);font-weight:400;font-size:32px;line-height:1.05;margin:0 0 6px;color:var(--olive);-webkit-text-stroke:.3px var(--olive)}
  .tinfo .do{margin-top:14px}
  .tinfo .more-link{width:100%;margin:10px 0 0}
  .alive{display:block;margin-top:6px;font-family:var(--typed);font-size:13px;color:var(--olive)}
  .dayhead{margin:18px 0 0;font-family:var(--engraved);font-weight:400;font-size:22px;line-height:1.1;-webkit-text-stroke:.25px var(--deep)}
  .notice .ph{height:132px}
  .stampd{display:inline-block;padding:3px 8px 2px;border:1.4px solid var(--deep);border-radius:4px;background:var(--sheet);font-family:var(--typed);font-size:12px;line-height:1.3;text-transform:uppercase;rotate:-2.5deg;filter:url(#ink)}
  .stampd.cream{border-color:var(--cream);color:var(--cream);background:none}
  .stampd.big{font-size:15px;padding:5px 12px 3px;border-width:1.8px;border-radius:5px;margin-bottom:4px}
  .enter .stampd{animation:stamp .5s .4s both}
  .notice .cb{margin-top:-18px}
  .notice .t{display:block;font-family:var(--engraved);font-size:30px;line-height:1;margin:10px 0 7px;-webkit-text-stroke:.3px var(--deep)}
  .notice .type{font-size:13px;line-height:1.35}
  /* rails: sheets dealt out by hand */
  .rail{display:flex;gap:14px;overflow-x:auto;margin:0 calc(var(--m)*-1);padding:8px var(--m) 16px;scroll-padding-left:var(--m);scroll-snap-type:x mandatory;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .rail>*{scroll-snap-align:start;flex:0 0 auto}
  .arrival{width:176px}
  .arrival .ph{height:118px}
  .arrival .cn{font-size:24px}
  .arrival .row{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
  .arrival .p{font-family:var(--typed);font-size:15px}
  .built{width:232px}
  .built .ph{height:150px}
  .built .cn{font-size:26px}
  .built .type{font-size:13px}

  /* ---------- the feed: features like a magazine, the studio's week, and a shop you can see ---------- */
  .feat{display:block;width:100%;color:var(--deep)}
  .fx{position:relative;display:block;height:300px;margin:8px 8px 0;border-radius:12px;overflow:hidden;background:var(--olive);-webkit-mask:url(art/edge-all.webp) center/100% 100% no-repeat;mask:url(art/edge-all.webp) center/100% 100% no-repeat}
  .fx canvas,.fx img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
  .feat .cb{margin-top:-4px;padding:6px 16px 18px}
  .who{display:block;margin:12px 0 0;font-family:var(--engraved);font-size:46px;line-height:.95;-webkit-text-stroke:.4px var(--deep)}
  .hl2{display:block;font-family:var(--engraved);font-size:25px;line-height:1.08;margin:6px 0 8px;color:var(--olive);-webkit-text-stroke:.3px var(--olive)}
  .dek{display:block;font-family:var(--typed);font-size:14.5px;line-height:1.45;margin:0 0 14px}
  .stamprow{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .mins{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--olive);white-space:nowrap}
  .read{display:flex;justify-content:space-between;align-items:center;height:46px;padding:0 16px;border-radius:var(--r-btn);background:var(--olive);color:var(--cream);font-family:var(--typed);font-size:15px;white-space:nowrap}
  /* the spotlight deck: the front card full size, the other two tucked behind it, peeking out either side. Dots say where you are */
  .sstack{position:relative;display:grid;margin:6px 0 0;padding:0 var(--m);touch-action:pan-y;-webkit-user-select:none;user-select:none}
  .sstack .feat{grid-area:1/1;transform-origin:50% 50%;will-change:transform;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s ease}
  .sstack .fx{height:220px}
  .sstack .dek{display:none}
  .sstack .who{font-size:38px;margin-top:10px}
  .sstack .hl2{font-size:22px;margin:4px 0 10px}
  .sstack .read{height:auto;padding:0;background:none;color:var(--olive);justify-content:flex-start;gap:8px}
  .sdots{display:flex;justify-content:center;gap:8px;margin-top:6px}
  .sdots i{width:7px;height:7px;border-radius:50%;background:var(--olive);opacity:.26;transition:opacity .2s ease,scale .2s ease}
  .sdots i.on{opacity:1;scale:1.2}
  /* plans: a sheet on white, the name, how hard it is, and the files to take away */
  .plan{width:300px}
  .plan .sheet{display:block;height:196px;margin:8px 8px 0;border-radius:12px;overflow:hidden;background:#fff}
  .plan .sheet img{display:block;width:100%;height:100%;object-fit:contain}
  .plan .cb{margin-top:0;padding:10px 16px 14px}
  .plan .cn{font-size:28px;margin:0}
  .plan .type{display:block;margin-top:3px;font-size:13px}
  .hl2,.who,.cn,.mtitle,.story h1,.story .sub,.tname,.stepq,.qhead,.mname,.rn,.notice .t,.en,.hero-empty h1,.ask,.fh{text-wrap:balance}
  .plan .open{display:block;width:100%;text-align:left;color:var(--deep)}
  .plan .open .cb{display:block;margin-top:0;padding:10px 16px 0}
  .lvlrow{display:flex;align-items:center;gap:8px;margin-top:0;padding:12px 16px 14px}
  .files{margin-left:auto;display:flex;gap:6px}
  .files a{padding:7px 9px 6px;border-radius:8px;background:var(--olive);color:var(--cream);font-family:var(--sans);font-size:10.5px;letter-spacing:.12em;text-decoration:none}
  .piece{width:300px}
  .piece .ph{height:236px}
  .piece .cb{margin-top:-18px;padding:0 16px 12px}
  .piece .cn{font-size:30px;margin:10px 0 0}
  .piece .prow{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .nice{display:inline-flex;align-items:center;gap:6px;min-height:38px;margin:4px 0 -8px -8px;flex:0 0 auto;padding:0 10px 0 8px;border-radius:19px;color:var(--olive);font-family:var(--typed);font-size:14px}
  .nice i{display:block;width:16px;height:21px;background:currentColor;-webkit-mask:url(art/leaf-tl.svg) center/contain no-repeat;mask:url(art/leaf-tl.svg) center/contain no-repeat;transition:scale .3s cubic-bezier(.16,1,.3,1)}
  .nice.on{color:var(--deep)}
  .nice.on i{scale:1.2}
  .shot{display:block;height:150px;margin:8px 8px 0;border-radius:12px;overflow:hidden;background:#fff}
  .shot img{display:block;width:100%;height:100%;object-fit:cover}
  .week{position:relative;margin-left:8px;padding-left:28px}
  .week::before{content:"";position:absolute;left:4px;top:14px;bottom:18px;border-left:1.4px solid rgba(64,68,4,.55);filter:url(#ink)}
  .ev{position:relative;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 0 16px;background:url(art/m-rule.svg) left bottom/100% 8px no-repeat}
  .ev:last-child{background:none}
  .ev::before{content:"";position:absolute;left:-29px;top:20px;width:10px;height:10px;border:1.4px solid var(--deep);border-radius:3px;background:var(--page)}
  .ev.on::before{background:var(--olive-glow)}
  .ev .stampd{font-size:11px;padding:2px 7px 1px}
  .ev .en{display:block;font-family:var(--engraved);font-size:24px;line-height:1.02;margin:7px 0 4px;-webkit-text-stroke:.3px var(--deep)}
  .ev .type{font-size:12.5px}
  .go2{min-height:40px;padding:0 14px;border-radius:20px;box-shadow:inset 0 0 0 1px var(--line);font-family:var(--typed);font-size:14px;color:var(--deep);white-space:nowrap}
  .go2.on{background:var(--olive);color:var(--cream);box-shadow:none}

  /* ---------- a feature, read in full ---------- */
  #feature.on{display:block;min-height:100vh;padding-bottom:calc(40px + var(--safe-b))}
  .app[data-view="feature"] .tabs{display:none}
  .fhero{position:relative;height:48vh;min-height:300px;background:var(--olive)}
  .fhero .fx{position:absolute;inset:0;height:auto;margin:0;border-radius:0;-webkit-mask:none;mask:none}
  .fhero .pushbar{position:absolute;left:0;right:0;top:0;z-index:2}
  .fhero .back{color:var(--cream);text-shadow:0 1px 10px rgba(30,34,4,.7)}
  .story{position:relative;margin-top:-28px;padding:24px var(--m) 0;border-radius:var(--r-sheet) var(--r-sheet) 0 0;background:var(--page)}
  .story h1{font-family:var(--engraved);font-weight:400;font-size:42px;line-height:1;margin:12px 0 10px;-webkit-text-stroke:.4px var(--deep)}
  .story .sub{font-family:var(--engraved);font-size:27px;line-height:1.05;color:var(--olive);-webkit-text-stroke:.3px var(--olive);margin:0 0 10px}
  .story .dek{font-size:16px;margin-bottom:12px}
  .story .byline{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 20px;padding-bottom:12px;background:url(art/m-rule.svg) left bottom/100% 8px no-repeat}
  .story p{font-family:var(--typed);font-size:15.5px;line-height:1.62;margin:0 0 16px}
  .story .cap{float:left;font-family:var(--engraved);font-size:68px;line-height:.78;margin:7px 9px 0 0;-webkit-text-stroke:.5px var(--deep)}
  .story blockquote{margin:22px 0 24px;padding:14px 0 16px;font-family:var(--engraved);font-size:28px;line-height:1.08;color:var(--olive);-webkit-text-stroke:.35px var(--olive);background:url(art/m-rule.svg) left top/100% 8px no-repeat,url(art/m-rule.svg) left bottom/100% 8px no-repeat}
  .story .ph2{margin:4px -8px 20px}
  .story .ph2 .ph{height:224px}
  .story .cap2{display:block;margin-top:6px;padding:0 8px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--warm-gray)}
  .fend{display:grid;gap:12px;margin:14px 0 0;padding-top:16px;background:url(art/m-rule.svg) left top/100% 8px no-repeat}
  .fend .nice{margin-left:-8px}

  /* ---------- a machine's sheet ---------- */
  .stagebox{background:var(--olive) url(art/field.webp) 0 0/402px 700px}
  .trow{grid-template-columns:96px 1fr 16px;column-gap:12px;min-height:104px;padding:6px var(--m) 6px 8px}
  .trow .ph{width:96px;height:90px}
  .trow .mname{font-size:27px}
  /* the calendar is marked up by hand: open days underlined as far as they're free, today circled, full days struck */
  .cal .open{background:none}
  .cal .today{box-shadow:none}
  .cal .today::before{content:"";position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;background:url(art/m-circle-olive.svg) center/100% 100% no-repeat}
  .cal .open:active{background:var(--olive);color:var(--cream);border-radius:50%}
  .cal i{width:28px;height:7px;background:none}
  .cal i::after{background:url(art/m-under.svg) left center/28px 7px no-repeat}
  .cal .open:active i::after{background:none}
  .cal .full{opacity:.55;box-shadow:none}
  .cal .full::after{content:"";position:absolute;inset:9px 8px;background:url(art/m-strike.svg) center/100% 100% no-repeat}
  .cal .open.sel{background:var(--olive);color:var(--cream);border-radius:50%}
  .cal .open.sel i::after{background:none}
  .cal .open.sel::before{display:none}
  .tgrid{gap:10px}
  .tbtn{background:var(--olive);color:var(--cream);animation:down .5s var(--ease) both;animation-delay:calc(var(--i)*38ms)}
  .tbtn:nth-child(4n+1){rotate:-.7deg}
  .tbtn:nth-child(4n+2){rotate:.6deg}
  .tbtn:nth-child(4n+3){rotate:.5deg}
  .tbtn:nth-child(4n){rotate:-.5deg}
  .tbtn:active{background:var(--deep);color:var(--cream)}
  .tbtn.off{position:relative;background:none;color:var(--deep);box-shadow:none;opacity:.78}
  .tbtn.off::after{content:"";position:absolute;inset:8px 10px;background:url(art/m-strike.svg) center/100% 100% no-repeat}
  .tbtn.mine{color:var(--deep)}
  .quick{background:var(--olive) url(art/field.webp) 0 0/402px 700px;rotate:-.6deg}
  .mcard{rotate:-1.2deg}

  @media (prefers-reduced-motion:reduce){
    .sett{opacity:1;translate:0 0;transition:none}
    .ln,.con path,.stampd,.typed,.tbtn{animation:none !important}
    .view.on,.dot,.caret::after,.hl.swipe{animation:none}
    .slip,.art .green,.art .sketch,.climb video,.spot,.rope .walked,.skspot{transition:none}
    .skname.on{animation:none}
  }
</style>
</head>

// the paper and the wash: paper fills the screen, then green bleeds out from the logo with a pooled, uneven edge, and the building is what's under it

let overlay = true;

async function load(){
  document.documentElement.classList.add('locked');

  const still = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  const k = Math.min(.62, Math.max(.3, (W-56)/656)), cx = W/2, cy = H*.42, at = params.has('at') ? +params.get('at') : null;
  const stage = $('#skstage'), marks = $('#logoanim'), stamp = $('#skname'), spot = $('#skspot');
  const place = el => { el.style.left = (cx-328*k)+'px'; el.style.top = (cy-221*k)+'px'; el.style.transform = `scale(${k})`; };
  place(marks);
  stamp.style.top = (cy+250*k)+'px'; spot.style.left = cx+'px'; spot.style.top = cy+'px';
  const wash = makeWash($('#skwash'),cx,cy);

  const data = await fetch('art/logo-strokes.json').then(r => r.json()).catch(() => null);
  const pen = data ? makePencil($('#skpencil'),data,k,cx,cy) : null;
  const S = still ? .01 : first ? 1 : .6;
  if (first){ try { const v = $('#bgv'); v.currentTime = 0; const pr = v.play(); if (pr && pr.catch) pr.catch(() => {}); } catch(e) {} $('#climb').classList.add('on'); }

  }
  if (at !== null) document.getAnimations().forEach(a => { a.pause(); a.currentTime = at*1000*S; });
  const t0 = performance.now();
  await new Promise(done => {
    const stop = at !== null ? 0 : setTimeout(done, 4200*S + 800);   // a stalled frame loop can't leave the paper on screen
    (function frame(now){
      const t = at !== null ? at : (now-t0)/1000/S;
      try {
        if (pen) pen.draw(t);
        if (t>1.75) stamp.classList.add('on');
        if (wash && t>2){ $('#splash').classList.add('open'); const x = Math.min(1,(t-2)/1.25); wash.draw(.2+x*x*(3-2*x)*1.4); }
        if (t>2.6) spot.classList.add('on');

        if (!first && t>2.15) stage.classList.add('out');
      } catch(e) {}
      if (at !== null) return;
      if (t>(first ? 3.3 : 2.75)){ clearTimeout(stop); return done(); }
      requestAnimationFrame(frame);

  });
  if (!first){ $('#splash').classList.add('gone'); await sleep(420); $('#splash').style.display = 'none'; return overlayDone(); }

  stage.classList.add('out'); spot.classList.remove('on');

// the labels that ride on the model
function ride(list, host = $('#s-tags'), minY = 96){
  const v = view3d; if (!host || !v) return;
  host.innerHTML = list.map((t,i) => `<button class="ptag${t.num?' num':''}${t.lit?' lit':''}" ${t.machine ? `data-machine="${t.machine}"` : ''} ${t.tour ? `data-tour="${t.tour}"` : ''} ${t.quick ? `data-quick-book="${t.quick}"` : ''} ${t.unit!==undefined ? `data-unit="${t.unit}"` : ''}>${t.html}</button>`).join('');
  const els = [...host.children];
  v.clearHooks();
  // labels on neighboring tools step up so they never sit on each other
  v.addHook(() => {
    const boxes = els.map((el,i) => { const p = v.project(list[i].at), w = el.offsetWidth, h = el.offsetHeight; return { el, x:p.x-w/2, y:p.y-h-9, w, h, front:p.front, py:p.y }; }).sort((a,b) => b.py-a.py);
    boxes.forEach((b,i) => { for (let j = 0; j < i; j++){ const o = boxes[j]; if (b.x < o.x+o.w+3 && o.x < b.x+b.w+3 && b.y < o.y+o.h+3 && o.y < b.y+b.h+3) b.y = o.y-b.h-3; } });
    const W = host.clientWidth;
    boxes.forEach(b => { b.el.style.transform = `translate(${Math.round(b.x)}px,${Math.round(b.y)}px)`; b.el.style.visibility = b.front && b.y > minY && b.x > -6 && b.x + b.w < W + 6 ? 'visible' : 'hidden'; });
  });
}

function suits(dayKey, i){
  const w = member.when || []; if (!w.length) return true;
  const d = fromKey(dayKey).getDay();
  const h = mins(i)/60;
  return w.some(a => a==='Weekends' ? (d===0 || d===6) : a==='Mornings' ? h < 12 : a==='Afternoons' ? (h >= 12 && h < 17) : h >= 17);
}

}

// ---------- the day band: the day painted as one stroke, morning to evening, in her wash. Drag along it and the floor relights ----------
const BAND_FS = `precision highp float;varying vec2 v;uniform float T,N,A,D,K,L;
  float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
  float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
  float fb(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*n(p);p=p*2.07+5.3;a*=.5;}return s;}
  void main(){
    vec2 q=vec2(v.x*A,v.y);
    float wob=fb(q*vec2(1.4,5.)+2.)-.5;
    float hw=.27+wob*.17+(fb(q*vec2(9.,30.)+7.)-.5)*.05;
    float inside=1.-smoothstep(hw-.025,hw+.035,abs(v.y-.5));
    vec3 morning=vec3(.96,.94,.82),noon=vec3(.86,.88,.36),evening=vec3(.24,.27,.05);
    vec3 day=mix(mix(morning,noon,smoothstep(0.,.42,v.x)),evening,smoothstep(.5,1.,v.x));
    float dry=fb(vec2(q.x*34.,q.y*4.5)+9.);
    day*=.88+.24*dry;
    float past=(N>=0.)?1.-smoothstep(N-.012,N+.012,v.x):0.;
    day=mix(day,mix(day,vec3(.44,.46,.12),.6),past);
    float tick=0.;
    for(int i=0;i<13;i++){float x=float(i)*K;tick=max(tick,(1.-smoothstep(0.,.0035,abs(v.x-x)))*step(.17,abs(v.y-.5)));}
    tick=max(tick,(1.-smoothstep(0.,.004,abs(v.x-.996)))*step(.1,abs(v.y-.5)));
    float span=smoothstep(T-.012,T+.004,v.x)*(1.-smoothstep(T+L-.004,T+L+.012,v.x));
    float nowl=(N>=0.&&N<=1.)?1.-smoothstep(0.,.005,abs(v.x-N)):0.;
    float d=length((v-vec2(T,.5))*vec2(A,1.))+(fb(v*vec2(6.,3.)+1.)-.5)*.12;
    float spot=1.-smoothstep(.03,.16+.12*D,d);
    vec3 col=day+vec3(.2,.18,.03)*spot*.6+vec3(.17,.16,.03)*span;
    col=mix(col,vec3(.99,.97,.9),tick*.3*inside);
    col=mix(col,vec3(.99,.97,.9),nowl*.9);
    col+=(h(v*vec2(700.,120.))-.5)*.04;
    float handle=max(1.-smoothstep(.004,.012,abs(v.x-T)),.6*(1.-smoothstep(.003,.009,abs(v.x-T-L))));
    col=mix(col,vec3(.99,.97,.9),handle*(.75+.25*D));
    float alpha=max(inside,handle)*(.94+.06*spot);
    gl_FragColor=vec4(col*alpha,alpha);
  }`;

const DAY = CLOSE-OPEN, slotFrac = i => (mins(i)-OPEN)/DAY;
const nowFrac = () => minsNow() < OPEN ? -1 : minsNow() > CLOSE ? 1.2 : (minsNow()-OPEN)/DAY;
const HOURS = [9,11,13,15,17,19];
const hourLabel = h => (h%12||12);
// the band control: the day painted, the chosen span lit, a handle to drag. o = { day, slot, dur, onDrag(i), onPick(i), fits(i) }
function bandControl(host, o){
  host.innerHTML = `<div class="tlabels">${HOURS.map((h,i) => `<span class="${i ? '' : 'first'}" style="left:${((h*60-OPEN)/DAY*100).toFixed(2)}%">${hourLabel(h)}</span>`).join('')}<span class="last" style="left:100%">9:30</span></div><canvas class="bandcv"></canvas><div class="busyov"></div><span class="tlabel"></span>`;
  const cv = host.querySelector('.bandcv'), lab = host.querySelector('.tlabel'), ov = host.querySelector('.busyov');
  const band = makeBand(cv); if (!band){ host.style.display = 'none'; return null; }
  const k = o.day, nowI = isToday(k) ? slotNow() : -1, nowF = isToday(k) ? nowFrac() : -1;
  let dur = o.dur, idx = o.slot, t = slotFrac(idx), target = t, d = 0, dT = 0, raf = 0, dragging = false;
  const past = i => isToday(k) && startOf(k,i) <= now() && i!==nowI;
  const ok = i => i >= 0 && i < SLOTS.length && !past(i) && mins(i)+dur <= CLOSE && (!o.fits || o.fits(i, dur));
  const nearestOk = i => { for (let r = 0; r < SLOTS.length; r++){ if (ok(i-r)) return i-r; if (ok(i+r)) return i+r; } return idx; };
  const place = (f, i) => { lab.textContent = slotTime(i) + (i===nowI ? ' · now' : ''); const half = lab.offsetWidth/2, W = cv.clientWidth; lab.style.left = Math.max(half, Math.min(W-half, f*W))+'px'; };
  const shade = () => { if (!o.fits) return; ov.innerHTML = SLOTS.map((_,i) => !past(i) && !o.fits(i, STEP) ? `<i style="left:${(slotFrac(i)*100).toFixed(2)}%;width:${(STEP/DAY*100).toFixed(2)}%"></i>` : '').join(''); };
  const tick = () => { t += (target-t)*.22; d += (dT-d)*.2; band.draw(t, nowF, d, dur/DAY); if (Math.abs(target-t) > .0015 || Math.abs(dT-d) > .01) raf = requestAnimationFrame(tick); else { t = target; d = dT; band.draw(t, nowF, d, dur/DAY); } };
  const go = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); };

    if (!dragging) return; const f = at(e); target = f; const i = nearestOk(Math.max(0, Math.min(SLOTS.length-1, Math.round(f*DAY/STEP))));

    place(f, idx); go();

  cv.addEventListener('pointermove', move);
  const end = () => { if (!dragging) return; dragging = false; dT = 0; target = slotFrac(idx); place(target, idx); go(); if (o.onPick) o.onPick(idx); };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  shade(); place(t, idx); band.draw(t, nowF, 0, dur/DAY);
  return { setDur(nd){ dur = nd; if (!ok(idx)){ idx = nearestOk(idx); target = slotFrac(idx); place(target, idx); if (o.onDrag) o.onDrag(idx); } shade(); go(); }, slot: () => idx };
}

const dursHTML = cur => `<div class="durrow">${DURS.map(d => `<button class="dur${d===cur ? ' on' : ''}" data-dur="${d}">${durWords(d)}</button>`).join('')}</div>`;

function lightLive(v){

    us.forEach((u,n) => { const f = !isOut(m,sel.day) && unitFree(m,sel.day,sel.slot,n); map[u.key] = f ? 'open' : 'busy'; if (f && !first) first = u; });

// a tool: it zooms in, and the bottom asks one question at a time. What day, what time, which one, then reserve

  else if (bagTotal() > wallet.balance) dock.innerHTML = `<p class="tag">On your card · ${money(wallet.balance)} · ${money(bagTotal() - wallet.balance)} short</p><button class="do" data-topup="bag">Add money to pay ${money(bagTotal())}</button>`;
  else dock.innerHTML = `<p class="tag">From your card · ${money(wallet.balance)}</p><button class="do" id="g-pay">Pay ${money(bagTotal())}</button>`;
}
function payBag(){
  const n = bagCount();
  if (!pay(bagTotal(), 'The shop', `${n} item${n>1?'s':''}`)) return;
  paid = 'Pick it up at the crib window, floor 2. Bring your card.';
  pickup = { n:(pickup ? pickup.n : 0) + n, at:Date.now() }; savePickup();
  bag = {}; saveBag(); pending = null; renderBag();
}

// ---------- card: money up top, account below, log out last ----------
let amount = 25, pending = null;   // pending: the reservation or bag that sent them here to add money
const AMOUNTS = [10, 25, 50, 100];
// the slip under the card: what is waiting, how short the card is, and once it's covered the one tap that finishes it
function holdSlip(){
  if (!pending) return '';
  const short = Math.max(0, pending.need - wallet.balance), ok = short < .005, c = pending.cur;
  const what = pending.kind==='bag' ? 'Your bag' : c.m.name, n = pending.kind==='bag' ? bagCount() : 0;
  const sub = pending.kind==='bag' ? `${n} item${n===1 ? '' : 's'} · crib window, floor 2` : `${dayName(c.day)}, ${c.m.job==='print' ? estWords(c.dur)+' print' : when(c.slot, c.dur)}`;
  return `<div class="card ticket hold"><button class="tk" ${ok ? 'data-resume' : ''}><span class="stampd${ok ? ' lit' : ''}">${ok ? 'Covered' : money(short)+' short'}</span><span class="tn">${what}</span><span class="tag">${sub} · ${money(pending.need)}</span></button>${ok ? `<button class="do glow" data-resume>${pending.kind==='bag' ? 'Pay' : 'Reserve'} <span aria-hidden="true">→</span></button>` : ''}</div>`;
}
// the balance counts up to its new figure, whole dollars at a time
function rollBalance(from, to){
  const el = $('#c-body .mcard .amount'); if (!el) return;
  const cents = to - Math.floor(to), t0 = performance.now(), ms = 700;
  (function f(now){ const p = Math.min(1, (now - t0)/ms), e = 1 - Math.pow(1-p, 3); el.textContent = money(p < 1 ? Math.floor(from + (to-from)*e - cents + .0001) + cents : to); if (p < 1) requestAnimationFrame(f); })(t0); setTimeout(() => { if (el.isConnected) el.textContent = money(to); }, ms + 60);
}
let acctEdit = null;
const list = (a, none) => (a && a.length) ? a.join(', ') : none;
const arow = (k, label, value, act) => `<button class="arow${acctEdit===k ? ' open' : ''}" data-edit="${k}"><span class="tag">${label}</span><span class="type">${value}</span><span class="chg">${acctEdit===k ? 'Done' : act}</span></button>`;
const OPTS = { makes:QUESTIONS[0].opts, level:QUESTIONS[1].opts, when:QUESTIONS[3].opts };
const chips = k => acctEdit!==k ? '' : `<div class="aedit chips">${OPTS[k].map(o => `<button class="chip${(k==='level' ? member.level===o : (member[k] || []).includes(o)) ? ' on' : ''}" data-pick="${k}|${o}">${o}</button>`).join('')}</div>`;
function renderCard(){
  const name = member.name || 'Member';
  $('#c-body').innerHTML = mast(false) + `
    <div class="mcard field"><div class="ln ln-card" aria-hidden="true"></div>
      <div class="split" style="align-items:flex-start"><i class="crest cream" aria-hidden="true"></i><span class="tag">Maker Space card</span></div>
      <div class="bal"><span class="tag">Balance</span><span class="amount">${money(wallet.balance)}</span></div>
      <div class="split"><span class="type">${esc(name)}</span><span class="num">No. 00808</span></div>
    </div>
    ${holdSlip()}
    <section class="sec" style="padding-top:26px"><div class="sechead"><h2>Add money</h2></div>
      <div class="amts">${AMOUNTS.map(n => `<button class="amt${n===amount?' on':''}" data-amt="${n}">$${n}</button>`).join('')}</div>
      <button class="do" id="c-add">Add ${money(amount)}</button>
      <p class="tag payfrom">From ${esc(member.pay || 'Bank card ending 4482').replace(/^B/, 'b')}</p>
    </section>
    <section class="sec"><div class="sechead"><h2>Activity</h2></div>
      ${wallet.log.length ? wallet.log.slice(0,6).map(l => led(l.what, (l.amt<0?'−':'+')+money(Math.abs(l.amt)))).join('') : '<p class="type" style="margin-top:12px">Nothing yet. Bookings and shop runs land here.</p>'}
    </section>
    <section class="sec"><div class="sechead"><h2>Account</h2></div>
      <div class="acct">
        ${arow('name','Name',esc(name),'Change')}${acctEdit==='name' ? `<div class="aedit"><input class="ainput" id="a-name" autocomplete="given-name" autocapitalize="words" value="${esc(member.name || '')}" placeholder="Your name"><button class="do" data-save="name">Save</button></div>` : ''}
        ${arow('makes','I make',list(member.makes,'Not set'),'Change')}${chips('makes')}
        ${arow('level','Experience',member.level || 'Not set','Change')}${chips('level')}
        ${arow('when','I’m free',list(member.when,'Anytime'),'Change')}${chips('when')}
        <button class="arow" data-notify><span class="tag">Updates</span><span class="type">${member.quiet ? 'Off' : 'When it’s your turn'}</span><span class="sw${member.quiet ? '' : ' on'}"><i></i></span></button>
        ${arow('pay','Pay with',member.pay || 'Bank card ending 4482','Change')}${acctEdit==='pay' ? `<div class="aedit chips">${['Bank card ending 4482','Bank card ending 0917'].map(o => `<button class="chip${(member.pay || 'Bank card ending 4482')===o ? ' on' : ''}" data-pick="pay|${o}">${o}</button>`).join('')}<button class="chip" data-pick="pay|Bank card ending 4482">Add a card</button></div>` : ''}
        ${arow('help','Help','Service desk, ground floor','More')}${acctEdit==='help' ? `<div class="aedit"><p class="type">Open 9 am to 8 pm, every day. Bring your card and someone will sort it with you.</p><button class="do" data-desk>Message the desk</button></div>` : ''}
      </div>
    </section>
    <button class="logout" id="c-out">Log out</button>`;
}

// ---------- the update ----------
// it lands when the booked time starts, if the app is open
const timers = new Map();
function schedule(b){
  const ms = startOf(b.day,b.slot) - now();
  if (ms > 0 && ms < 864e5) timers.set(b, setTimeout(() => showUpdate(b), ms));
}
let hideT;
function showUpdate(b){
  const m = machine(b.machine), u = $('#update');
  $('#u-from').textContent = slotTime(b.slot); $('#u-to').textContent = b.print ? endWords(b.slot, b.dur || 90) : slotEnd(b.slot, b.dur || 90);
  $('#u-name').textContent = m.name+' · '+where(m);
  u._b = b; u.setAttribute('aria-hidden','false'); u.classList.add('on');
  clearTimeout(hideT); hideT = setTimeout(hideUpdate, 9000);
  if (app.dataset.view==='home') renderHome();
}
function hideUpdate(){ const u = $('#update'); u.classList.remove('on'); u.setAttribute('aria-hidden','true'); }
$('#update').addEventListener('click', e => { const b = e.currentTarget._b; hideUpdate(); if (b) openBooked(b, false); });

// ---------- views: three tabs at the root, everything else pushes on top, with real back so swipe-back works ----------
const app = $('#app'), scrollAt = {};
const TABS = ['home','book','card'];
let featureId = null;
function openFeature(id){ featureId = id; go('feature'); }
function renderFeature(){
  const f = FEATURES.find(x => x.id===featureId); if (!f) return;
  const piece = BUILT.find(b => b.by===f.who) || BUILT[0];
  const [p1, p2, p3, ...rest] = f.body;
  $('#ft-body').innerHTML = `<div class="fhero"><span class="fx" data-spot="${f.img}"><img src="${f.img}" alt=""></span><div class="pushbar"><button class="back" data-back><span>‹</span> Home</button></div></div>
    <article class="story">
      <span class="stampd">${f.kind}</span><h1>${f.who}</h1><p class="sub">${f.title}</p><p class="dek">${f.dek}</p><p class="byline">${f.min} min read</p>
      <p><span class="cap">${p1[0]}</span>${p1.slice(1)}</p><p>${p2}</p>
      <blockquote>${f.quote}</blockquote>
      <div class="ph2 sett">${ph(f.img2,'all')}<span class="cap2">${f.caption}</span></div>
      <p>${p3}</p>${rest.map(p => `<p>${p}</p>`).join('')}
      <div class="fend">${niceBtn(piece)}<button class="do" data-machine-go="${f.machine}">Book the ${f.tool} <span>→</span></button></div>
    </article>`;
  mountSpots();
}
const RENDER = { home:renderHome, feature:renderFeature, book:renderBook, focus:renderFocus, tour:renderTour, plan:renderPlan, product:renderProduct, card:renderCard, machine:() => { renderMachine(); stageForMachine(true); }, bagview:renderBag, shop:renderShop, shopfocus:renderShopFocus };
let root = 'home', goTo = null;
function paint(v){
  entering();
  document.querySelectorAll('.view').forEach(s => s.classList.toggle('on', s.id===v));
  app.dataset.view = v;
  if (TABS.includes(v)) root = v;
  if (v==='focus' || v==='machine') root = 'book';
  if (v==='feature' || v==='tour' || v==='plan') root = 'home';
  if (v!=='focus' && v!=='machine' && v!=='tour' && v!=='book') leave3d();
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab===root));
  if (RENDER[v]) RENDER[v]();
  shopBar();
}
function go(v){
  scrollAt[app.dataset.view] = scrollY;
  paint(v); scrollTo(0,0);
  history.pushState({ v, depth:(history.state && history.state.depth || 0)+1 }, '');
  setBar();
}
function tab(v){
  if (history.state && history.state.depth) return toRoot(v);
  if (v===app.dataset.view) return scrollTo({ top:0, behavior:'smooth' });
  scrollAt[app.dataset.view] = scrollY;
  paint(v); scrollTo(0, scrollAt[v] || 0);
  history.replaceState({ v, depth:0 }, '');
  setBar();
}
function toRoot(v){
  const depth = history.state && history.state.depth || 0;
  if (!depth) return tab(v);
  goTo = v; history.go(-depth);
}
addEventListener('popstate', e => {
  const v = goTo || (e.state && e.state.v) || 'home';
  if (goTo){ goTo = null; history.replaceState({ v, depth:0 }, ''); scrollAt[v] = 0; }
  paint(v); scrollTo(0, scrollAt[v] || 0); setBar();
});

// the status bar reads cream over olive and dark over paper. The phone frame reads this too
function setBar(){
  const root_ = document.documentElement;
  root_.dataset.swipe = (overlay || okUp) ? 'cream' : 'ink';
  if (overlay || okUp){ root_.dataset.bar = 'cream'; return; }
  const v = app.dataset.view;
  const cream = ['book','focus','machine','shop','tour'].includes(v) || (v==='feature' && scrollY < innerHeight*.48-60) || (v==='home' && scrollY < $('#hero').offsetHeight - 40) || (v==='shopfocus' && scrollY < $('#sf-body .field').offsetHeight - 40);
  document.documentElement.dataset.bar = cream ? 'cream' : 'ink';
  const heroUnder = (v==='home' || v==='book' || v==='shop') && cream && scrollY > 6;
  app.classList.toggle('scrim', !cream || heroUnder);
  app.classList.toggle('olive', heroUnder);
}
addEventListener('scroll', setBar, { passive:true });

// the shop's way to the bag sits by the thumb, not up at the top of the screen
function shopBar(){
  const bar = $('#bagbar'), on = ['shop','shopfocus','product'].includes(app.dataset.view) && bagCount()>0;
  bar.classList.toggle('on', on);
  if (on) bar.innerHTML = `<span>View bag · <span class="num">${pad(bagCount())}</span></span><span class="num">${money(bagTotal())}</span>`;
}
function refreshBag(){
  const y = scrollY, v = app.dataset.view;
  // in the shop only the steppers change, so the search and the scroll stay where they are
  if (v==='shop' || v==='product'){ document.querySelectorAll('[data-step]').forEach(w => w.innerHTML = stepper(w.dataset.step)); shopBar(); setBar(); return; }
  if (RENDER[v]) RENDER[v]();
  shopBar(); scrollTo(0,y); setBar();
}

app.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.tab) return tab(d.tab);
  if (d.tabRoot) return toRoot(d.tabRoot);
  if (d.topup){
    const need = d.topup==='bag' ? bagTotal() : costOf(cur.dur);
    pending = d.topup==='bag' ? { kind:'bag', need } : { kind:'machine', cur:{ ...cur }, need };
    amount = AMOUNTS.find(n => n >= need - wallet.balance) || AMOUNTS[AMOUNTS.length-1];
    return toRoot('card');
  }
  if (d.resume !== undefined && pending){
    const p = pending; pending = null;
    if (p.kind==='bag'){ go('bagview'); return payBag(); }
    cur = p.cur; calAt = monthOff(cur.day); return book();
  }
  if (d.back !== undefined) return history.back();
  // the bag is the bag, wherever you are. The shop has its own doors: Home, each area, and the empty bag
  if (d.bag !== undefined){ paid = null; return go('bagview'); }
  if (d.goshop !== undefined) return go('shop');
  if (d.add){ bag[d.add] = (bag[d.add]||0)+1; saveBag(); return refreshBag(); }
  if (d.less){ bag[d.less] -= 1; if (!bag[d.less]) delete bag[d.less]; saveBag(); return refreshBag(); }
  if (d.go){ return toggleGoing(d.go); }
  if (d.feature) return openFeature(d.feature);
  if (d.plan) return openPlan(d.plan);
  if (d.product) return openProduct(d.product);
  if (d.machineGo){ paint('book'); return openMachine(d.machineGo); }
  if (d.nice !== undefined){
    const on = !nice[d.nice]; nice[d.nice] = on; if (!on) delete nice[d.nice]; saveNice();
    const b = BUILT.find(x => x.name===d.nice);
    document.querySelectorAll(`.nice[data-nice="${CSS.escape(d.nice)}"]`).forEach(el => { el.classList.toggle('on', on); el.querySelector('span').textContent = b.nice + (on ? 1 : 0); });
    return;
  }
  if (d.read !== undefined) return t.classList.toggle('open');
  if (d.focus) return openFocus(d.focus);
  if (d.shopfocus){ shopArea = d.shopfocus; shopQ = ''; return go('shop'); }
  if (d.shoparea){ shopArea = d.shoparea; document.querySelectorAll('#s-pills .pill').forEach(b => b.classList.toggle('on', b.dataset.shoparea===shopArea)); return renderShopGrid(); }
  if (d.machine) return openMachine(d.machine);
  if (d.booked){ const [id,day,slot] = d.booked.split('|'); return openBooked(mineAt(id,day,+slot), false); }
  if (d.day){ cur.day = d.day; cur.slot = null; cur.unit = null; calAt = monthOff(d.day); if (cur.m.job==='print'){ const r = printRun(cur.m, cur.day, cur.est); if (r){ cur.slot = r.slot; cur.unit = r.unit; } renderMachine(); stageForMachine(true); return scrollTo(0,0); } renderMachine(); stageForMachine(false); const h = $('.dayhead'); return h && h.scrollIntoView({ block:'nearest', behavior:'smooth' }); }
  if (d.slot){ cur.slot = +d.slot; cur.unit = Math.max(0, firstFree(cur.m,cur.day,cur.slot,cur.dur)); renderMachine(); stageForMachine(true); return scrollTo(0,0); }
  if (d.quick){ const [q,i] = d.quick.split('|'); cur.day = q; calAt = monthOff(q); if (cur.m.job==='print'){ const r = printRun(cur.m, q, cur.est, +i); cur.slot = r ? r.slot : null; cur.unit = r ? r.unit : null; } else { cur.slot = +i; cur.unit = Math.max(0, firstFree(cur.m,q,+i,cur.dur)); } renderMachine(); stageForMachine(true); return scrollTo(0,0); }
  if (d.quickBook){ const [id,q,i] = d.quickBook.split('|'); return quickBook(id, q, +i); }
  if (d.checkin){ const [id,q,i] = d.checkin.split('|'); const b = mineAt(id,q,+i); if (b){ b.in = true; save(); } return renderHome(); }
  if (d.gotit !== undefined){ pickup = null; savePickup(); return renderHome(); }
  if (d.tourOpen !== undefined) return openTour();
  if (d.tour) return tourPick(d.tour);
  if (d.tourAll !== undefined){ tourArea = null; return renderTour(); }
  if (d.hslot !== undefined){ pickSlot = { day:pickSlot.day, slot:+d.hslot }; return renderLive(); }
  if (d.disc){ liveArea = liveArea===d.disc ? null : d.disc; renderDisc(); if (view3d && app.dataset.view==='book') focusFloor(view3d); return; }
  if (d.pickFile !== undefined){ const z = e.target.closest('.drop'); if (z){ z.classList.add('reading'); z.innerHTML = '<span class="dt">Reading stool-foot.stl</span><span class="tag">5.0 MB · sliced for 0.2 mm</span>'; } setTimeout(() => { if (app.dataset.view!=='machine' || !cur.m || cur.m.job!=='print' || cur.file) return; cur.file = { name:'stool-foot.stl', size:5*1048576 }; cur.est = 45; renderMachine(); stageForMachine(false); scrollTo(0,0); }, 900); return; }
  if (d.est){ cur.est = Math.max(15, Math.min(48*60, cur.est + +d.est)); renderMachine(); return; }
  if (d.estOk !== undefined){ cur.estOk = true; cur.dur = cur.est; if (cur.slot !== null){ const r = printRun(cur.m, cur.day, cur.est, cur.slot); cur.slot = r ? r.slot : null; cur.unit = r ? r.unit : null; } renderMachine(); stageForMachine(true); return scrollTo(0,0); }
  if (d.dur){
    const nd = +d.dur;
    if (app.dataset.view==='machine'){ cur.dur = nd; if (cur.slot!==null && !unitFree(cur.m,cur.day,cur.slot,cur.unit,nd)){ const u = firstFree(cur.m,cur.day,cur.slot,nd); if (u < 0){ cur.slot = null; cur.unit = null; } else cur.unit = u; } renderMachine(); stageForMachine(false); return; }
    pickDur = nd; try { localStorage.setItem('808-dur', nd); } catch(e) {}
    renderDurs(); if (liveBand) liveBand.setDur(nd); renderLive(); return;
  }
  if (d.cal){ calAt = Math.max(0, Math.min(2, calAt + +d.cal)); return renderMachine(); }
  if (d.unit !== undefined) return pickUnit(+d.unit);
  if (d.anyone !== undefined) return pickUnit(Math.max(0, firstFree(cur.m,cur.day,cur.slot,cur.dur)));
  if (d.change){ if (d.change==='day' || d.change==='slot'){ cur.slot = null; cur.unit = null; } if (d.change==='unit') cur.unit = null; if (d.change==='file') cur.file = null; if (d.change==='time') cur.estOk = false; renderMachine(); stageForMachine(true); return scrollTo(0,0); }
  if (d.mine){ return openBooked(mineAt(cur.m.id,cur.day,+d.mine), false); }
  if (d.amt){ amount = +d.amt; return renderCard(); }
  if (d.edit !== undefined){ acctEdit = acctEdit===d.edit ? null : d.edit; renderCard(); const i = $('#a-name'); if (i){ i.focus(); i.select(); } return; }
  if (d.save !== undefined){ member.name = ($('#a-name').value || '').trim(); acctEdit = null; saveMember(); return renderCard(); }
  if (d.pick !== undefined){
    const [k, v] = d.pick.split('|');
    if (k==='level' || k==='pay'){ member[k] = v; acctEdit = null; }
    else { const a = member[k] = member[k] || [], i = a.indexOf(v); i<0 ? a.push(v) : a.splice(i,1); }
    if (k==='makes') member.wing = pickWing(member.makes);
    saveMember(); return renderCard();
  }
  if (d.desk !== undefined){ acctEdit = null; renderCard(); return; }
  if (d.notify !== undefined){ member.quiet = !member.quiet; saveMember(); return renderCard(); }
  if (t.id==='m-book') return book();
  if (t.id==='d-done') return toRoot('home');
  if (t.id==='d-cancel') return cancel();
  if (t.id==='g-pay') return payBag();
  if (t.id==='g-done'){ paid = null; return toRoot(root); }
  if (t.id==='g-shop') return go('shop');
  if (t.id==='c-add'){ const from = wallet.balance; wallet.balance += amount; wallet.log.unshift({ what:'Added to card', sub:'', amt:amount }); saveWallet(); renderCard(); return rollBalance(from, wallet.balance); }
  if (t.id==='c-out'){ ['808-member','808-bookings','808-card','808-bag','808-going','808-pickup'].forEach(k => { try { localStorage.removeItem(k); } catch(e) {} }); location.href = location.pathname + '?reset'; }
});
function toggleGoing(id){
  const ev = [...EVENTS, SPEAKER].find(x => x.id===id), on = !going[id];
  if (ev.cost){
    if (on && !pay(ev.cost, ev.name, 'Workshop')) return tab('card');
    if (!on) refund(ev.cost, ev.name, 'Workshop');
  }
  if (on) going[id] = true; else delete going[id];
  saveGoing(); const y = scrollY; renderHome(); scrollTo(0,y);
}

bookings = live(); save(); bookings.forEach(schedule);
const startTab = params.get('tab');
paint(TABS.includes(startTab) ? startTab : 'home');
history.replaceState({ v:app.dataset.view, depth:0 }, '');
setBar();
new MutationObserver(arm).observe(app, { childList:true, subtree:true });
arm();
if (params.has('fast') && member.done){ $('#splash').style.display = 'none'; overlayDone(); } else load();
